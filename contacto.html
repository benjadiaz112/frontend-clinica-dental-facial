<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva | Clínica Aura</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="index.html">Clínica Aura</a>
            <div class="menu">
                <a class="btn" href="index.html">Inicio</a>
                <a class="btn" href="nosotros.html">Nosotros</a>
                <a class="btn" href="servicios.html">Tratamientos</a>
                <a class="btn" href="contacto.html">Reserva</a>
            </div>
        </nav>
    </header>

    <main>
        <h1>Reserva una evaluación</h1>
        <p>Completa tus datos y te contactaremos.</p>
        <div class="disposicion-contacto">
            <form id="formulario" novalidate>
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" autocomplete="name" placeholder="Ejemplo: Ana Pérez">
                <small class="error" id="error-nombre"></small>

                <label for="rut">RUT</label>
                <input type="text" id="rut" placeholder="12.345.678-5">
                <small class="error" id="error-rut"></small>

                <label for="correo">Correo</label>
                <input type="email" id="correo" autocomplete="email" placeholder="nombre@correo.cl">
                <small class="error" id="error-correo"></small>

                <label for="servicio">Servicio</label>
                <select id="servicio">
                    <option value="">Selecciona una opción</option>
                    <option>Odontología general</option>
                    <option>Limpieza dental</option>
                    <option>Blanqueamiento</option>
                    <option>Ortodoncia</option>
                    <option>Armonización facial</option>
                </select>
                <small class="error" id="error-servicio"></small>

                <label for="mensaje">Comentario</label>
                <textarea id="mensaje" rows="4" maxlength="500" placeholder="Escribe tu consulta"></textarea>
                <div class="acciones-form">
                    <button class="btn" type="submit">Enviar</button>
                    <button class="btn" type="reset">Limpiar</button>
                </div>
                <p id="resultado" aria-live="polite"></p>
            </form>
            <img class="imagen-contacto" src="imagenes/consulta-dental.jpg" alt="Atención profesional en Clínica Aura">
        </div>
    </main>

    <footer><p>Clínica Aura | Providencia, Santiago | +56 2 2345 6789</p></footer>
    <script src="js/script.js"></script>
</body>
</html>
