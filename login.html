<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Clínica Aura</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <nav>
            <a class="logo" href="index.html">Clínica Aura</a>
            <div class="menu">
                <a class="btn" href="index.html">Inicio</a>
                <a class="btn" href="nosotros.html">Nosotros</a>
                <a class="btn" href="servicios.html">Tratamientos</a>
                <a class="btn" href="presupuesto.html">Mi pedido <span class="contador-carrito">0</span></a>
                <a class="btn" href="contacto.html">Reserva</a>
                <a class="btn" href="login.html">Ingresar</a>
                <a class="btn" href="registro.html">Registro</a>
            </div>
        </nav>
    </header>

    <main class="contenedor-autenticacion">
        <h1>Iniciar sesión</h1>
        <form id="form-login" novalidate>
            <label for="login-correo">Correo</label>
            <input type="email" id="login-correo" maxlength="100" autocomplete="email" placeholder="nombre@duoc.cl">
            <small class="error" id="error-login-correo"></small>

            <label for="login-clave">Contraseña</label>
            <input type="password" id="login-clave" minlength="4" maxlength="10" autocomplete="current-password" placeholder="Entre 4 y 10 caracteres">
            <small class="error" id="error-login-clave"></small>

            <button class="btn" type="submit">Ingresar</button>
            <p id="resultado-login" aria-live="polite"></p>
            <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>.</p>
        </form>
    </main>

    <footer><p>Clínica Aura | Providencia, Santiago | +56 2 2345 6789</p></footer>
    <script src="js/auth.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
